<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" font-family="'Segoe UI', Arial, Helvetica, sans-serif" role="img" aria-label="Architektur des Abschlussprojekts: main.bicep und cloud-init.yaml werden bereitgestellt; VNet mit snet-web, NSG und VM mit Public IP; cloud-init installiert nginx">
