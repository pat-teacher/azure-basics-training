<text x="80" y="347" font-size="12" fill="#27303A" font-weight="bold" text-anchor="start">65000</text>
<text x="140" y="347" font-size="12" fill="#6F6F6F" font-weight="bold" text-anchor="start">Allow</text>
<text x="195" y="347" font-size="12" fill="#27303A" font-weight="normal" text-anchor="start">VirtualNetwork (Default)</text>
<text x="80" y="369" font-size="12" fill="#27303A" font-weight="bold" text-anchor="start">65500</text>
<text x="140" y="369" font-size="12" fill="#B3261E" font-weight="bold" text-anchor="start">Deny</text>
<text x="195" y="369" font-size="12" fill="#27303A" font-weight="normal" text-anchor="start">alles andere (Default)</text>
<text x="260" y="440" font-size="12" fill="#6F6F6F" font-weight="normal" text-anchor="middle">Im Abschlussprojekt kommt hier die VM dazu.</text>
