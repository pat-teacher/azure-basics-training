<text x="55" y="243" font-size="13" fill="#27303A" font-weight="bold" text-anchor="start">Subnet snet-web · 10.10.1.0/24</text>
<rect x="60" y="258" width="400" height="130" rx="8" fill="#FFFFFF" stroke="#006FAD" stroke-width="2"/>
<text x="75" y="281" font-size="13" fill="#006FAD" font-weight="bold" text-anchor="start">NSG nsg-web</text>
<text x="80" y="303" font-size="12" fill="#27303A" font-weight="bold" text-anchor="start">200</text>
<text x="140" y="303" font-size="12" fill="#2E7D32" font-weight="bold" text-anchor="start">Allow</text>
<text x="195" y="303" font-size="12" fill="#27303A" font-weight="normal" text-anchor="start">TCP 80 von Internet</text>
