<text x="320" y="78" font-size="12" fill="#006FAD" font-weight="bold" text-anchor="middle">az deployment sub create</text>
<rect x="420" y="58" width="240" height="62" rx="8" fill="#FFFFFF" stroke="#27303A" stroke-width="1.5"/>
<text x="540.0" y="84.16666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Azure Resource Manager</text>
<text x="540.0" y="103.16666666666667" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">vergleicht Ziel und Ist</text>
<line x1="540" y1="122" x2="540" y2="178" stroke="#27303A" stroke-width="2" marker-end="url(#aD)"/>
<rect x="20" y="182" width="960" height="340" rx="8" fill="#F7F7F7" stroke="#6F6F6F" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="35" y="205" font-size="13" fill="#27303A" font-weight="bold" text-anchor="start">Resource Group rg-tag5-&lt;kuerzel&gt; › VNet vnet-tag5-&lt;kuerzel&gt; · Address Space 10.10.0.0/16</text>
