<text x="120.0" y="74.66666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">main.bicep</text>
<rect x="20" y="96" width="200" height="40" rx="8" fill="#D5D8F4" stroke="#006FAD" stroke-width="1.5"/>
<text x="120.0" y="120.66666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">network.bicep</text>
