<rect x="520" y="375" width="440" height="130" rx="8" fill="#FFFFFF" stroke="#006FAD" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="535" y="398" font-size="13" fill="#006FAD" font-weight="bold" text-anchor="start">Subnet snet-admin · 10.10.3.0/29</text>
<text x="740" y="450" font-size="12" fill="#006FAD" font-weight="normal" text-anchor="middle">kommt in Schritt 6 dazu</text>
<text x="500" y="552" font-size="13" fill="#27303A" font-weight="normal" text-anchor="middle">main.bicep erstellt die Resource Group, network.bicep das Netz. Azure erstellt, was fehlt – und ändert nichts, was schon stimmt.</text>
