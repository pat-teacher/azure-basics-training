<text x="700.0" y="285.6666666666667" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Azure</text>
<text x="700.0" y="304.6666666666667" font-size="12" fill="#FFFFFF" font-weight="normal" text-anchor="middle">rg-tag5-tofu-&lt;kuerzel&gt;</text>
<text x="700.0" y="323.6666666666667" font-size="12" fill="#FFFFFF" font-weight="normal" text-anchor="middle">Storage Account</text>
<line x1="500" y1="145" x2="380" y2="253" stroke="#6F6F6F" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#aG)"/>
<text x="475" y="205" font-size="12" fill="#6F6F6F" font-weight="bold" text-anchor="start">vergleicht</text>
<line x1="695" y1="145" x2="695" y2="253" stroke="#2E7D32" stroke-width="2" marker-end="url(#aO)"/>
<text x="705" y="205" font-size="12" fill="#2E7D32" font-weight="bold" text-anchor="start">erstellt / ändert</text>
<line x1="890" y1="145" x2="830" y2="253" stroke="#B3261E" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#aN)"/>
<text x="880" y="225" font-size="12" fill="#B3261E" font-weight="bold" text-anchor="start">löscht</text>
<line x1="477" y1="300" x2="558" y2="300" stroke="#6F6F6F" stroke-width="2" stroke-dasharray="7 5" marker-start="url(#aG)" marker-end="url(#aG)"/>
<text x="500" y="400" font-size="13" fill="#27303A" font-weight="normal" text-anchor="middle">Bicep braucht keinen State: Azure selbst ist der Zustand.</text>
<text x="500" y="425" font-size="13" fill="#27303A" font-weight="normal" text-anchor="middle">OpenTofu merkt sich den Zustand in terraform.tfstate. Diese Datei gehört nie ins Git.</text>
