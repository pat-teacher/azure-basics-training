<text x="305.0" y="101.16666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">tofu init</text>
<text x="305.0" y="120.16666666666667" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">lädt Provider azurerm</text>
<line x1="392" y1="106" x2="413" y2="106" stroke="#006FAD" stroke-width="2" marker-end="url(#aB)"/>
<rect x="415" y="70" width="170" height="72" rx="8" fill="#FFFFFF" stroke="#006FAD" stroke-width="1.5"/>
<text x="500.0" y="101.16666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">tofu plan</text>
<text x="500.0" y="120.16666666666667" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">zeigt + ~ −, ändert nichts</text>
<line x1="587" y1="106" x2="608" y2="106" stroke="#006FAD" stroke-width="2" marker-end="url(#aB)"/>
<rect x="610" y="70" width="170" height="72" rx="8" fill="#FFFFFF" stroke="#006FAD" stroke-width="1.5"/>
<text x="695.0" y="101.16666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">tofu apply</text>
<text x="695.0" y="120.16666666666667" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">führt den Plan aus</text>
<line x1="782" y1="106" x2="803" y2="106" stroke="#006FAD" stroke-width="2" marker-end="url(#aB)"/>
<rect x="805" y="70" width="170" height="72" rx="8" fill="#FFFFFF" stroke="#B3261E" stroke-width="1.5"/>
<text x="890.0" y="101.16666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">tofu destroy</text>
<text x="890.0" y="120.16666666666667" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">löscht alles im State</text>
<rect x="215" y="255" width="260" height="90" rx="8" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1.5" stroke-dasharray="6 4"/>
