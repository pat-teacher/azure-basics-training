<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="'Segoe UI', Arial, Helvetica, sans-serif" role="img" aria-label="VNet mit Subnet snet-web (vm-web mit Public IP und NSG) und Subnet snet-intern (vm-intern ohne Public IP); Laptop erreicht vm-intern nur über vm-web">
<defs><marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27303A"/></marker><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#006FAD"/></marker><marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E7D32"/></marker><marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B3261E"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6F6F"/></marker></defs>
<rect width="1000" height="600" fill="#FFFFFF"/>
<rect x="0" y="595" width="1000" height="5" fill="#006FAD"/>
<text x="20" y="30" font-size="18" fill="#27303A" font-weight="bold" text-anchor="start">Auftrag 4.3: zwei VMs im VNet</text>
<rect x="60" y="50" width="220" height="56" rx="8" fill="#D5D8F4" stroke="#006FAD" stroke-width="1.5"/>
<text x="170.0" y="73.16666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Dein Laptop</text>
<text x="170.0" y="92.16666666666667" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">PowerShell · ssh</text>
<rect x="395" y="140" width="210" height="46" rx="8" fill="#FFFFFF" stroke="#006FAD" stroke-width="1.5"/>
<text x="500.0" y="158.16666666666666" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Public IP</text>
<text x="500.0" y="177.16666666666666" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">z. B. 20.208.51.90</text>
<rect x="20" y="215" width="960" height="330" rx="8" fill="#F7F7F7" stroke="#6F6F6F" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="35" y="238" font-size="13" fill="#27303A" font-weight="bold" text-anchor="start">VNet vnet-tag4-&lt;kuerzel&gt; · Address Space 10.10.0.0/16</text>
<rect x="40" y="255" width="440" height="270" rx="8" fill="#DEE2FB" stroke="#27303A" stroke-width="1.5"/>
<text x="55" y="278" font-size="13" fill="#27303A" font-weight="bold" text-anchor="start">Subnet snet-web · 10.10.1.0/24</text>
<rect x="60" y="292" width="400" height="62" rx="8" fill="#FFFFFF" stroke="#006FAD" stroke-width="2"/>
<text x="75" y="315" font-size="13" fill="#006FAD" font-weight="bold" text-anchor="start">NSG nsg-web</text>
<text x="75" y="338" font-size="12" fill="#2E7D32" font-weight="bold" text-anchor="start">1000  Allow  TCP 22 (SSH) von *</text>
<rect x="150" y="405" width="220" height="80" rx="8" fill="#27303A" stroke="#27303A" stroke-width="1.5"/>
<text x="260.0" y="430.6666666666667" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">vm-web-&lt;kuerzel&gt;</text>
<text x="260.0" y="449.6666666666667" font-size="12" fill="#FFFFFF" font-weight="normal" text-anchor="middle">10.10.1.4</text>
<text x="260.0" y="468.6666666666667" font-size="12" fill="#FFFFFF" font-weight="normal" text-anchor="middle">mit Public IP</text>
<rect x="520" y="255" width="440" height="270" rx="8" fill="#DEE2FB" stroke="#27303A" stroke-width="1.5"/>
<text x="535" y="278" font-size="13" fill="#27303A" font-weight="bold" text-anchor="start">Subnet snet-intern · 10.10.2.0/24</text>
<text x="740" y="330" font-size="12" fill="#6F6F6F" font-weight="normal" text-anchor="middle">keine NSG</text>
<rect x="630" y="405" width="220" height="80" rx="8" fill="#27303A" stroke="#27303A" stroke-width="1.5"/>
<text x="740.0" y="430.6666666666667" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">vm-intern-&lt;kuerzel&gt;</text>
<text x="740.0" y="449.6666666666667" font-size="12" fill="#FFFFFF" font-weight="normal" text-anchor="middle">10.10.2.4</text>
<text x="740.0" y="468.6666666666667" font-size="12" fill="#FFFFFF" font-weight="normal" text-anchor="middle">keine Public IP</text>
<line x1="230" y1="106" x2="420" y2="140" stroke="#2E7D32" stroke-width="2" marker-end="url(#aO)"/>
<text x="285" y="136" font-size="12" fill="#2E7D32" font-weight="bold" text-anchor="middle">ssh ✓</text>
<line x1="500" y1="186" x2="300" y2="403" stroke="#2E7D32" stroke-width="2" marker-end="url(#aO)"/>
<line x1="372" y1="432" x2="628" y2="432" stroke="#2E7D32" stroke-width="2" marker-start="url(#aO)" marker-end="url(#aO)"/>
<rect x="415" y="446" width="170" height="28" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/>
<text x="500.0" y="464.0" font-size="12" fill="#2E7D32" font-weight="bold" text-anchor="middle">ping ✓ · ssh -J ✓</text>
<polyline points="280,78 910,78 910,380" fill="none" stroke="#B3261E" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="910" y1="380" x2="852" y2="405" stroke="#B3261E" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#aN)"/>
<text x="700" y="68" font-size="12" fill="#B3261E" font-weight="bold" text-anchor="middle">direkt vom Laptop auf 10.10.2.4 ✗</text>
<text x="500" y="570" font-size="13" fill="#27303A" font-weight="normal" text-anchor="middle">vm-intern erreichst du nur über vm-web (Jump Host). Die private IP 10.10.2.4 gibt es nur im VNet.</text>
</svg>
