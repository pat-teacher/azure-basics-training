# Website (GitHub Pages) – Quellen werden mit tools/website/build.py nach _website/ kopiert
site_name: Azure-Kurs
site_description: Einführung in Cloud Computing mit Microsoft Azure – ein Hands-on-Kurs von PAT Cloud Solutions
site_author: PAT Cloud Solutions
site_url: https://pat-teacher.github.io/azure-basics-training/
repo_url: https://github.com/pat-teacher/azure-basics-training
repo_name: azure-basics-training
copyright: © 2026 PAT Cloud Solutions · Kursunterlagen für die interne Schulung im Auftrag des Kantons Zürich, Nutzung gemäss Vertrag.

docs_dir: _website
site_dir: _site
use_directory_urls: false   # Seiten liegen wie im Repo (kurs/tag-1.html), damit relative Bildpfade stimmen

theme:
  name: material
  language: de
  logo: assets/branding/logo-hell.svg
  favicon: assets/branding/favicon-P.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dunkles Design }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Helles Design }
  font:
    text: Source Sans 3
    code: Source Code Pro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - content.code.copy

extra_css:
  - assets/website/pat.css

hooks:
  - tools/website/hooks.py

plugins:
  - search:
      lang: de

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - sane_lists
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds: { case: lower }

not_in_nav: |
  /loesungen/**

validation:
  links:
    unrecognized_links: ignore

nav:
  - Start: index.md
  - Kurs:
      - Organisation: kurs/organisation.md
      - Tag 1 – Virtualisierung: kurs/tag-1.md
      - Tag 2 – Azure Grundlagen: kurs/tag-2.md
      - Tag 3 – Compute und Storage: kurs/tag-3.md
      - Tag 4 – Networking: kurs/tag-4.md
      - Tag 5 – Automatisierung: kurs/tag-5.md
  - Aufträge:
      - auftraege/README.md
      - Tag 1:
          - auftraege/tag-1/README.md
          - 1.1 Hypervisor und dein Laptop: auftraege/tag-1/1.1-hypervisor-und-dein-laptop.md
          - 1.2 Multipass und deine erste VM: auftraege/tag-1/1.2-multipass-und-erste-vm.md
          - 1.3 CPU und RAM einer VM: auftraege/tag-1/1.3-ressourcen-einer-vm.md
          - 1.4 Server von Hand einrichten: auftraege/tag-1/1.4-server-von-hand.md
          - 1.5 Erste automatische VM: auftraege/tag-1/1.5-erste-automatische-vm.md
          - 1.6 SSH-Schlüssel: auftraege/tag-1/1.6-ssh-schluessel.md
          - 1.7 Container mit Docker ⭐: auftraege/tag-1/1.7-container-mit-docker.md
  - Theorie:
      - theorie/README.md
      - 1 Virtualisierung: theorie/01-virtualisierung.md
      - 2 Cloud-Grundlagen: theorie/02-cloud-grundlagen.md
      - 3 Aufbau von Azure: theorie/03-azure-aufbau.md
      - 4 Azure Compute: theorie/04-azure-compute.md
      - 5 Azure Storage: theorie/05-azure-storage.md
      - 6 Azure Networking: theorie/06-azure-networking.md
      - 7 Automatisierung: theorie/07-automatisierung.md
  - Präsentationen: praesentationen/README.md
