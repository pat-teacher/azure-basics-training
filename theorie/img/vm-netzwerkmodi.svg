<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="'Segoe UI', Arial, Helvetica, sans-serif" role="img" aria-label="Vergleich NAT und Netzwerkbrücke bei einer lokalen VM">
<defs><marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27303A"/></marker><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#006FAD"/></marker><marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E7D32"/></marker><marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B3261E"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6F6F"/></marker></defs>
<rect width="1000" height="470" fill="#FFFFFF"/>
<rect x="0" y="465" width="1000" height="5" fill="#006FAD"/>
<text x="20" y="30" font-size="18" fill="#27303A" font-weight="bold" text-anchor="start">VM-Netzwerk: NAT und Netzwerkbrücke</text>
<text x="40" y="62" font-size="16" fill="#006FAD" font-weight="bold" text-anchor="start">NAT (Standard)</text>
<rect x="340" y="76" width="120" height="40" rx="8" fill="#D5D8F4" stroke="#006FAD" stroke-width="1.5"/>
<text x="400.0" y="100.66666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Internet</text>
<rect x="30" y="130" width="440" height="300" rx="8" fill="#F7F7F7" stroke="#6F6F6F" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="45" y="152" font-size="12" fill="#6F6F6F" font-weight="normal" text-anchor="start">Schul-WLAN 192.168.1.0/24</text>
<rect x="50" y="165" width="250" height="245" rx="8" fill="#DEE2FB" stroke="#27303A" stroke-width="1.5"/>
<text x="175" y="188" font-size="13" fill="#27303A" font-weight="bold" text-anchor="middle">Dein Laptop · 192.168.1.20</text>
<rect x="75" y="202" width="200" height="36" rx="8" fill="#FFFFFF" stroke="#006FAD" stroke-width="1.5"/>
<text x="175.0" y="224.66666666666666" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">NAT</text>
<rect x="75" y="310" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#27303A" stroke-width="1.5"/>
<text x="175.0" y="335.6666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">VM</text>
<text x="175.0" y="354.6666666666667" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">172.27.0.5</text>
<text x="175.0" y="373.6666666666667" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">privates Netz des Hypervisors</text>
<line x1="110" y1="310" x2="110" y2="240" stroke="#27303A" stroke-width="2" marker-end="url(#aD)"/>
<line x1="275" y1="220" x2="395" y2="118" stroke="#006FAD" stroke-width="2" marker-end="url(#aB)"/>
<rect x="330" y="250" width="120" height="60" rx="8" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1.5"/>
<text x="390.0" y="275.1666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Laptop</text>
<text x="390.0" y="294.1666666666667" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">Partner/in</text>
<line x1="330" y1="300" x2="278" y2="345" stroke="#B3261E" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#aN)"/>
<text x="395" y="330" font-size="12" fill="#B3261E" font-weight="bold" text-anchor="middle">erreicht VM nicht ✗</text>
<text x="200" y="276" font-size="11" fill="#6F6F6F" font-weight="normal" text-anchor="middle">nur dein Laptop erreicht die VM</text>
<text x="530" y="62" font-size="16" fill="#006FAD" font-weight="bold" text-anchor="start">Netzwerkbrücke</text>
<rect x="830" y="76" width="120" height="40" rx="8" fill="#D5D8F4" stroke="#006FAD" stroke-width="1.5"/>
<text x="890.0" y="100.66666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Internet</text>
<rect x="520" y="130" width="440" height="300" rx="8" fill="#F7F7F7" stroke="#6F6F6F" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="535" y="152" font-size="12" fill="#6F6F6F" font-weight="normal" text-anchor="start">Schul-WLAN 192.168.1.0/24</text>
<rect x="540" y="165" width="250" height="245" rx="8" fill="#DEE2FB" stroke="#27303A" stroke-width="1.5"/>
<text x="665" y="188" font-size="13" fill="#27303A" font-weight="bold" text-anchor="middle">Dein Laptop · 192.168.1.20</text>
<rect x="565" y="202" width="200" height="36" rx="8" fill="#FFFFFF" stroke="#006FAD" stroke-width="1.5"/>
<text x="665.0" y="224.66666666666666" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Netzwerkbrücke</text>
<rect x="565" y="310" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#27303A" stroke-width="1.5"/>
<text x="665.0" y="335.6666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">VM</text>
<text x="665.0" y="354.6666666666667" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">192.168.1.57</text>
<text x="665.0" y="373.6666666666667" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">eigene IP im WLAN</text>
<line x1="600" y1="310" x2="600" y2="240" stroke="#27303A" stroke-width="2" marker-end="url(#aD)"/>
<line x1="765" y1="220" x2="885" y2="118" stroke="#006FAD" stroke-width="2" marker-end="url(#aB)"/>
<rect x="820" y="250" width="120" height="60" rx="8" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1.5"/>
<text x="880.0" y="275.1666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Laptop</text>
<text x="880.0" y="294.1666666666667" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">Partner/in</text>
<line x1="820" y1="300" x2="768" y2="345" stroke="#2E7D32" stroke-width="2" marker-end="url(#aO)"/>
<text x="885" y="330" font-size="12" fill="#2E7D32" font-weight="bold" text-anchor="middle">erreicht VM direkt*</text>
<text x="20" y="455" font-size="11" fill="#6F6F6F" font-weight="normal" text-anchor="start">* sofern das WLAN keine Client-Isolation hat</text>
</svg>
