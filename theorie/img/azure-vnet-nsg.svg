<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="'Segoe UI', Arial, Helvetica, sans-serif" role="img" aria-label="VNet mit zwei Subnetzen, NSG-Regeln und erlaubten sowie blockierten Verbindungen">
