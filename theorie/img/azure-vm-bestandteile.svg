<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="'Segoe UI', Arial, Helvetica, sans-serif" role="img" aria-label="Bestandteile einer Azure-VM: Compute, Datenträger, NIC, VNet, öffentliche IP und NSG">
<defs><marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27303A"/></marker><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#006FAD"/></marker><marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E7D32"/></marker><marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B3261E"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6F6F"/></marker></defs>
<rect width="1000" height="460" fill="#FFFFFF"/>
<rect x="0" y="455" width="1000" height="5" fill="#006FAD"/>
<text x="20" y="30" font-size="18" fill="#27303A" font-weight="bold" text-anchor="start">Woraus besteht eine Azure-VM?</text>
<rect x="20" y="48" width="960" height="380" rx="8" fill="#F7F7F7" stroke="#6F6F6F" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="35" y="70" font-size="13" fill="#6F6F6F" font-weight="bold" text-anchor="start">Ressourcengruppe rg-tag3-mm</text>
<rect x="380" y="85" width="240" height="90" rx="8" fill="#27303A" stroke="#27303A" stroke-width="1.5"/>
<text x="500.0" y="115.66666666666667" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Virtuelle Maschine (VM)</text>
<text x="500.0" y="134.66666666666669" font-size="12" fill="#FFFFFF" font-weight="normal" text-anchor="middle">vm-web-mm · Standard_B1s</text>
<text x="500.0" y="153.66666666666669" font-size="12" fill="#FFFFFF" font-weight="normal" text-anchor="middle">CPU + RAM (Compute)</text>
<rect x="50" y="225" width="220" height="70" rx="8" fill="#DEE2FB" stroke="#27303A" stroke-width="1.5"/>
<text x="160.0" y="255.16666666666666" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">OS-Datenträger (OS Disk)</text>
<text x="160.0" y="274.16666666666663" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">verwaltet, z. B. 30 GB</text>
<rect x="50" y="325" width="220" height="60" rx="8" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="160.0" y="350.1666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Datenträger</text>
<text x="160.0" y="369.1666666666667" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">optional, für Daten</text>
<rect x="390" y="230" width="220" height="70" rx="8" fill="#DEE2FB" stroke="#27303A" stroke-width="1.5"/>
<text x="500.0" y="260.1666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Netzwerkschnittstelle (NIC)</text>
<text x="500.0" y="279.1666666666667" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">private IP 10.0.0.4</text>
<rect x="380" y="345" width="240" height="62" rx="8" fill="#DEE2FB" stroke="#27303A" stroke-width="1.5"/>
<text x="500.0" y="371.1666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Virtuelles Netzwerk + Subnetz</text>
<text x="500.0" y="390.1666666666667" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">10.0.0.0/16 · 10.0.0.0/24</text>
<rect x="740" y="100" width="210" height="70" rx="8" fill="#DEE2FB" stroke="#27303A" stroke-width="1.5"/>
<text x="845.0" y="130.16666666666666" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Öffentliche IP (Public IP)</text>
<text x="845.0" y="149.16666666666666" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">z. B. 20.203.x.x</text>
<rect x="740" y="230" width="210" height="70" rx="8" fill="#FFFFFF" stroke="#006FAD" stroke-width="2"/>
<text x="845.0" y="250.66666666666666" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">NSG</text>
<text x="845.0" y="269.66666666666663" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">Netzwerksicherheitsgruppe</text>
<text x="845.0" y="288.66666666666663" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">z. B. Port 22 erlaubt</text>
<line x1="420" y1="175" x2="270" y2="240" stroke="#27303A" stroke-width="2" marker-end="url(#aD)"/>
<line x1="500" y1="175" x2="500" y2="230" stroke="#27303A" stroke-width="2" marker-end="url(#aD)"/>
<line x1="500" y1="300" x2="500" y2="345" stroke="#27303A" stroke-width="2" marker-end="url(#aD)"/>
<line x1="380" y1="160" x2="272" y2="345" stroke="#6F6F6F" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#aG)"/>
<line x1="610" y1="250" x2="740" y2="140" stroke="#27303A" stroke-width="2" marker-end="url(#aD)"/>
<line x1="740" y1="265" x2="612" y2="265" stroke="#006FAD" stroke-width="2" marker-end="url(#aB)"/>
<text x="676" y="285" font-size="12" fill="#006FAD" font-weight="bold" text-anchor="middle">schützt</text>
<text x="960" y="448" font-size="12" fill="#6F6F6F" font-weight="normal" text-anchor="end">Kostet laufend: VM (solange zugeordnet), Datenträger, öffentliche IP</text>
</svg>
