<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- Titel -->
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Hybrid Cloud – Beispiel «Möbel Muster AG»</text>

  <!-- Kunden oben rechts -->
  <g>
    <circle cx="700" cy="70" r="14" fill="none" stroke="#444" stroke-width="2"/>
    <path d="M 680 105 q 20 -22 40 0" fill="none" stroke="#444" stroke-width="2"/>
    <circle cx="745" cy="70" r="14" fill="none" stroke="#444" stroke-width="2"/>
    <path d="M 725 105 q 20 -22 40 0" fill="none" stroke="#444" stroke-width="2"/>
    <text x="800" y="80" font-size="15" fill="#222">Kunden im Internet</text>
    <line x1="720" y1="112" x2="720" y2="204" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- On-Premise Box -->
  <rect x="40" y="130" width="360" height="360" rx="10" fill="#eef2f7" stroke="#4a6785" stroke-width="2"/>
  <text x="220" y="160" text-anchor="middle" font-size="17" font-weight="bold" fill="#33475b">On Premises</text>
  <text x="220" y="180" text-anchor="middle" font-size="13" fill="#33475b">Serverraum im eigenen Firmengebäude</text>

  <!-- ERP Server -->
  <rect x="90" y="210" width="260" height="90" rx="6" fill="#ffffff" stroke="#4a6785" stroke-width="1.5"/>
  <rect x="105" y="228" width="40" height="54" rx="3" fill="#c9d6e3" stroke="#4a6785"/>
  <circle cx="125" cy="240" r="3" fill="#4a6785"/>
  <circle cx="125" cy="252" r="3" fill="#4a6785"/>
  <circle cx="125" cy="264" r="3" fill="#4a6785"/>
  <text x="240" y="248" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">ERP + Lagerverwaltung</text>
  <text x="240" y="268" text-anchor="middle" font-size="12.5" fill="#555">Altsystem – bleibt im Haus</text>

  <!-- Mitarbeiter -->
  <rect x="90" y="360" width="260" height="90" rx="6" fill="#ffffff" stroke="#4a6785" stroke-width="1.5"/>
  <rect x="105" y="385" width="34" height="24" rx="2" fill="#c9d6e3" stroke="#4a6785"/>
  <line x1="122" y1="409" x2="122" y2="418" stroke="#4a6785" stroke-width="2"/>
  <line x1="110" y1="418" x2="134" y2="418" stroke="#4a6785" stroke-width="2"/>
  <text x="240" y="398" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Mitarbeiter-PCs</text>
  <text x="240" y="418" text-anchor="middle" font-size="12.5" fill="#555">Büro &amp; Werkstatt</text>

  <!-- Mitarbeiter -> ERP -->
  <line x1="220" y1="360" x2="220" y2="305" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cloud Box -->
  <rect x="560" y="130" width="360" height="360" rx="10" fill="#eefaf2" stroke="#2e8b57" stroke-width="2"/>
  <text x="740" y="160" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e5e3c">Public Cloud</text>
  <text x="740" y="180" text-anchor="middle" font-size="13" fill="#1e5e3c">z. B. AWS, Microsoft Azure</text>

  <!-- Webshop skalierende Instanzen -->
  <rect x="626" y="226" width="240" height="70" rx="6" fill="#d8efe0" stroke="#2e8b57"/>
  <rect x="618" y="218" width="240" height="70" rx="6" fill="#e6f5eb" stroke="#2e8b57"/>
  <rect x="610" y="210" width="240" height="70" rx="6" fill="#ffffff" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="730" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Webshop</text>
  <text x="730" y="260" text-anchor="middle" font-size="12.5" fill="#555">mehrere Instanzen – skaliert</text>
  <text x="730" y="275" text-anchor="middle" font-size="12.5" fill="#555">automatisch im Weihnachtsgeschäft</text>

  <!-- Microsoft 365 -->
  <rect x="610" y="360" width="250" height="90" rx="6" fill="#ffffff" stroke="#2e8b57" stroke-width="1.5"/>
  <path d="M 640 405 a 12 12 0 0 1 6 -22 a 16 16 0 0 1 30 -4 a 12 12 0 0 1 4 26 z" fill="#d8efe0" stroke="#2e8b57"/>
  <text x="745" y="398" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Microsoft 365</text>
  <text x="745" y="418" text-anchor="middle" font-size="12.5" fill="#555">Mail, Office, Teams (SaaS)</text>

  <!-- VPN Verbindung Webshop -> ERP -->
  <line x1="610" y1="255" x2="350" y2="255" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrowGreen)"/>
  <rect x="392" y="228" width="176" height="22" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="1"/>
  <text x="480" y="243" text-anchor="middle" font-size="12.5" fill="#2e7d32">sichere Verbindung (VPN)</text>
  <text x="480" y="272" text-anchor="middle" font-size="12.5" fill="#2e7d32">Bestellungen fliessen ins ERP</text>

  <!-- Mitarbeiter -> M365 -->
  <line x1="350" y1="405" x2="610" y2="405" stroke="#444" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#arrow)"/>
  <text x="480" y="425" text-anchor="middle" font-size="12.5" fill="#555">Zugriff übers Internet</text>

  <!-- Fusszeile -->
  <text x="480" y="530" text-anchor="middle" font-size="14" fill="#333">Ein Teil läuft im Haus, ein Teil in der Cloud – zusammen ergibt das <tspan font-weight="bold">eine</tspan> Firmen-IT: Hybrid Cloud.</text>
</svg>
