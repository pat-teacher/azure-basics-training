<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="'Segoe UI', Arial, Helvetica, sans-serif" role="img" aria-label="SSH-Anmeldung: öffentlicher Schlüssel liegt auf dem Server, der Laptop löst die Prüfaufgabe mit dem privaten Schlüssel">
<defs><marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27303A"/></marker><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#006FAD"/></marker><marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E7D32"/></marker><marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B3261E"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6F6F"/></marker></defs>
<rect width="1000" height="540" fill="#FFFFFF"/>
<rect x="0" y="535" width="1000" height="5" fill="#006FAD"/>
<text x="20" y="30" font-size="18" fill="#27303A" font-weight="bold" text-anchor="start">Anmelden mit SSH-Schlüssel: so funktioniert es</text>
<rect x="30" y="50" width="300" height="400" rx="8" fill="#DEE2FB" stroke="#27303A" stroke-width="1.5"/>
<text x="180" y="76" font-size="15" fill="#27303A" font-weight="bold" text-anchor="middle">Dein Laptop</text>
<text x="180" y="95" font-size="12" fill="#6F6F6F" font-weight="normal" text-anchor="middle">C:\Users\&lt;du&gt;\.ssh\</text>
<rect x="55" y="110" width="250" height="64" rx="8" fill="#FFFFFF" stroke="#006FAD" stroke-width="2"/>
<text x="180.0" y="137.16666666666666" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">id_ed25519.pub</text>
<text x="180.0" y="156.16666666666666" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">öffentlicher Schlüssel = Schloss</text>
<rect x="55" y="300" width="250" height="78" rx="8" fill="#27303A" stroke="#27303A" stroke-width="1.5"/>
<text x="180.0" y="324.6666666666667" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">id_ed25519</text>
<text x="180.0" y="343.6666666666667" font-size="12" fill="#FFFFFF" font-weight="normal" text-anchor="middle">privater Schlüssel = Schlüssel</text>
<text x="180.0" y="362.6666666666667" font-size="12" fill="#FFFFFF" font-weight="normal" text-anchor="middle">bleibt hier – nie weitergeben</text>
<text x="180" y="420" font-size="12" fill="#6F6F6F" font-weight="normal" text-anchor="middle">beide erstellt mit ssh-keygen</text>
<rect x="670" y="50" width="300" height="400" rx="8" fill="#DEE2FB" stroke="#27303A" stroke-width="1.5"/>
<text x="820" y="76" font-size="15" fill="#27303A" font-weight="bold" text-anchor="middle">Server</text>
<text x="820" y="95" font-size="12" fill="#6F6F6F" font-weight="normal" text-anchor="middle">vm1 (Tag 1) oder Azure-VM (Tag 3)</text>
<rect x="695" y="110" width="250" height="64" rx="8" fill="#FFFFFF" stroke="#006FAD" stroke-width="2"/>
<text x="820.0" y="137.16666666666666" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">~/.ssh/authorized_keys</text>
<text x="820.0" y="156.16666666666666" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">Liste der erlaubten Schlösser</text>
<rect x="695" y="300" width="250" height="78" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
<text x="820.0" y="324.6666666666667" font-size="14" fill="#2E7D32" font-weight="bold" text-anchor="middle">Prüfung</text>
<text x="820.0" y="343.6666666666667" font-size="12" fill="#2E7D32" font-weight="normal" text-anchor="middle">passt die Lösung zum Schloss?</text>
<text x="820.0" y="362.6666666666667" font-size="12" fill="#2E7D32" font-weight="normal" text-anchor="middle">ja → angemeldet ✓</text>
<line x1="305" y1="142" x2="693" y2="142" stroke="#006FAD" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#aB)"/>
<circle cx="350" cy="126" r="11" fill="#006FAD"/>
<text x="350" y="131" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text>
<text x="368" y="131" font-size="12" fill="#006FAD" font-weight="bold" text-anchor="start">einmal: Schloss auf den Server kopieren</text>
<line x1="330" y1="215" x2="668" y2="215" stroke="#27303A" stroke-width="2" marker-end="url(#aD)"/>
<circle cx="350" cy="200" r="11" fill="#006FAD"/>
<text x="350" y="205" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text>
<text x="368" y="205" font-size="12" fill="#27303A" font-weight="normal" text-anchor="start">ssh ubuntu@&lt;IP&gt;: «Ich habe den Schlüssel dazu»</text>
<line x1="670" y1="265" x2="332" y2="265" stroke="#27303A" stroke-width="2" marker-end="url(#aD)"/>
<circle cx="350" cy="250" r="11" fill="#006FAD"/>
<text x="350" y="255" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text>
<text x="368" y="255" font-size="12" fill="#27303A" font-weight="normal" text-anchor="start">Server stellt eine Prüfaufgabe (Zufallszahl)</text>
<line x1="305" y1="330" x2="693" y2="330" stroke="#2E7D32" stroke-width="2" marker-end="url(#aO)"/>
<circle cx="350" cy="315" r="11" fill="#006FAD"/>
<text x="350" y="320" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">4</text>
<text x="368" y="320" font-size="12" fill="#2E7D32" font-weight="bold" text-anchor="start">Laptop löst sie mit dem privaten Schlüssel</text>
<text x="500" y="485" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Der private Schlüssel verlässt deinen Laptop nie. Über das Netz geht nur die Lösung der Prüfaufgabe.</text>
<text x="500" y="512" font-size="12" fill="#6F6F6F" font-weight="normal" text-anchor="middle">Wer nur das Schloss (den öffentlichen Schlüssel) kennt, kann die Aufgabe nicht lösen. Darum darf es jeder sehen.</text>
</svg>
