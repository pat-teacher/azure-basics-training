<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="'Segoe UI', Arial, Helvetica, sans-serif" role="img" aria-label="Hybride Cloud: sensible Daten und alte Anwendungen im eigenen Haus, Webshop in Azure, verbunden über VPN und gemeinsame Anmeldung">
<defs><marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27303A"/></marker><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#006FAD"/></marker><marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E7D32"/></marker><marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B3261E"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6F6F"/></marker></defs>
<rect width="1000" height="500" fill="#FFFFFF"/>
<rect x="0" y="495" width="1000" height="5" fill="#006FAD"/>
<text x="20" y="30" font-size="18" fill="#27303A" font-weight="bold" text-anchor="start">Hybride Cloud am Beispiel der Velo Zürich AG</text>
<rect x="20" y="60" width="330" height="340" rx="8" fill="#D5D8F4" stroke="#27303A" stroke-width="2"/>
<text x="185" y="86" font-size="16" fill="#27303A" font-weight="bold" text-anchor="middle">On Premises</text>
<text x="185" y="105" font-size="12" fill="#6F6F6F" font-weight="normal" text-anchor="middle">Serverraum im eigenen Haus</text>
<rect x="45" y="125" width="280" height="70" rx="8" fill="#FFFFFF" stroke="#27303A" stroke-width="1.5"/>
<text x="185.0" y="155.16666666666666" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Kundendaten, Buchhaltung</text>
<text x="185.0" y="174.16666666666666" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">sensibel – bleibt im Haus</text>
<rect x="45" y="210" width="280" height="70" rx="8" fill="#FFFFFF" stroke="#27303A" stroke-width="1.5"/>
<text x="185.0" y="240.16666666666666" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Kassensystem der Läden</text>
<text x="185.0" y="259.16666666666663" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">alte Anwendung, schwer zu migrieren</text>
<rect x="45" y="300" width="280" height="70" rx="8" fill="#DEE2FB" stroke="#6F6F6F" stroke-width="1.5"/>
<text x="185.0" y="330.1666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Mitarbeitende</text>
<text x="185.0" y="349.1666666666667" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">Büro und Läden</text>
<rect x="650" y="60" width="330" height="340" rx="8" fill="#DEE2FB" stroke="#006FAD" stroke-width="2"/>
<text x="815" y="86" font-size="16" fill="#006FAD" font-weight="bold" text-anchor="middle">Public Cloud: Azure</text>
<text x="815" y="105" font-size="12" fill="#6F6F6F" font-weight="normal" text-anchor="middle">neu und wachsend</text>
<rect x="675" y="125" width="280" height="95" rx="8" fill="#FFFFFF" stroke="#006FAD" stroke-width="2"/>
<text x="815" y="147" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Webshop</text>
<rect x="690" y="160" width="78" height="46" rx="8" fill="#DEE2FB" stroke="#006FAD" stroke-width="1.5"/>
<text x="729.0" y="187.0" font-size="12" fill="#27303A" font-weight="bold" text-anchor="middle">VM</text>
<rect x="778" y="160" width="78" height="46" rx="8" fill="#DEE2FB" stroke="#006FAD" stroke-width="1.5"/>
<text x="817.0" y="187.0" font-size="12" fill="#27303A" font-weight="bold" text-anchor="middle">VM</text>
<rect x="866" y="160" width="78" height="46" rx="8" fill="#DEE2FB" stroke="#006FAD" stroke-width="1.5"/>
<text x="905.0" y="187.0" font-size="12" fill="#27303A" font-weight="bold" text-anchor="middle">VM</text>
<text x="815" y="236" font-size="11" fill="#6F6F6F" font-weight="normal" text-anchor="middle">für die Kundschaft · Weihnachten: mehr VMs</text>
<rect x="675" y="250" width="280" height="60" rx="8" fill="#FFFFFF" stroke="#006FAD" stroke-width="1.5"/>
<text x="815.0" y="275.1666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Produktbilder</text>
<text x="815.0" y="294.1666666666667" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">Blob Storage</text>
<rect x="675" y="325" width="280" height="55" rx="8" fill="#FFFFFF" stroke="#006FAD" stroke-width="1.5"/>
<text x="815.0" y="347.8333333333333" font-size="13" fill="#27303A" font-weight="bold" text-anchor="middle">Microsoft Entra ID</text>
<text x="815.0" y="365.8333333333333" font-size="11" fill="#27303A" font-weight="normal" text-anchor="middle">eine Anmeldung für alles</text>
<line x1="355" y1="165" x2="645" y2="165" stroke="#006FAD" stroke-width="3" marker-start="url(#aB)" marker-end="url(#aB)"/>
<text x="500" y="152" font-size="13" fill="#006FAD" font-weight="bold" text-anchor="middle">Netzwerk: VPN</text>
<text x="500" y="185" font-size="11" fill="#6F6F6F" font-weight="normal" text-anchor="middle">Bestellungen fliessen in die Buchhaltung</text>
<line x1="355" y1="335" x2="645" y2="350" stroke="#006FAD" stroke-width="2" stroke-dasharray="7 5" marker-start="url(#aB)" marker-end="url(#aB)"/>
<text x="500" y="325" font-size="13" fill="#006FAD" font-weight="bold" text-anchor="middle">Anmeldung: ein Konto</text>
<text x="500" y="440" font-size="13" fill="#27303A" font-weight="bold" text-anchor="middle">Beide Teile sind verbunden und bilden zusammen eine Firmen-IT.</text>
<text x="500" y="463" font-size="12" fill="#6F6F6F" font-weight="normal" text-anchor="middle">Nur Microsoft 365 nutzen und daneben ein Server im Keller ist noch keine hybride Cloud.</text>
</svg>
