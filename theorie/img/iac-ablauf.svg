<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="'Segoe UI', Arial, Helvetica, sans-serif" role="img" aria-label="Portal, CLI und Bicep laufen über den Azure Resource Manager; cloud-init richtet die VM beim ersten Start ein">
<defs><marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27303A"/></marker><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#006FAD"/></marker><marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E7D32"/></marker><marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B3261E"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6F6F"/></marker></defs>
<rect width="1000" height="470" fill="#FFFFFF"/>
<rect x="0" y="465" width="1000" height="5" fill="#006FAD"/>
<text x="20" y="30" font-size="18" fill="#27303A" font-weight="bold" text-anchor="start">Drei Wege zur selben Infrastruktur</text>
<rect x="20" y="60" width="260" height="62" rx="8" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1.5"/>
<text x="150.0" y="86.16666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Azure-Portal</text>
<text x="150.0" y="105.16666666666667" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">klicken – gut zum Lernen</text>
<rect x="20" y="160" width="260" height="62" rx="8" fill="#FFFFFF" stroke="#27303A" stroke-width="1.5"/>
<text x="150.0" y="186.16666666666666" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Azure CLI / Skript</text>
<text x="150.0" y="205.16666666666666" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">imperativ: Schritt für Schritt</text>
<rect x="20" y="260" width="260" height="62" rx="8" fill="#DEE2FB" stroke="#006FAD" stroke-width="2.5"/>
<text x="150.0" y="286.1666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Bicep-Datei</text>
<text x="150.0" y="305.1666666666667" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">deklarativ: Zielzustand</text>
<rect x="20" y="360" width="260" height="50" rx="8" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="150.0" y="389.3333333333333" font-size="13" fill="#27303A" font-weight="bold" text-anchor="middle">ARM-Template (JSON)</text>
<line x1="150" y1="322" x2="150" y2="358" stroke="#6F6F6F" stroke-width="2" marker-end="url(#aG)"/>
<text x="160" y="344" font-size="11" fill="#6F6F6F" font-weight="normal" text-anchor="start">az bicep build</text>
<rect x="360" y="140" width="220" height="120" rx="8" fill="#27303A" stroke="#27303A" stroke-width="1.5"/>
<text x="470.0" y="176.16666666666666" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Azure Resource Manager</text>
<text x="470.0" y="195.16666666666666" font-size="12" fill="#FFFFFF" font-weight="normal" text-anchor="middle">(ARM)</text>
<text x="470.0" y="214.16666666666666" font-size="12" fill="#FFFFFF" font-weight="normal" text-anchor="middle">prüft Rechte und</text>
<text x="470.0" y="233.16666666666666" font-size="12" fill="#FFFFFF" font-weight="normal" text-anchor="middle">erstellt Ressourcen</text>
<line x1="280" y1="91" x2="360" y2="170" stroke="#27303A" stroke-width="2" marker-end="url(#aD)"/>
<line x1="280" y1="191" x2="360" y2="200" stroke="#27303A" stroke-width="2" marker-end="url(#aD)"/>
<line x1="280" y1="291" x2="360" y2="235" stroke="#006FAD" stroke-width="2" marker-end="url(#aB)"/>
<rect x="650" y="50" width="330" height="250" rx="8" fill="#F7F7F7" stroke="#6F6F6F" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="665" y="72" font-size="13" fill="#6F6F6F" font-weight="bold" text-anchor="start">Ressourcengruppe</text>
<rect x="670" y="90" width="135" height="46" rx="8" fill="#DEE2FB" stroke="#27303A" stroke-width="1.5"/>
<text x="737.5" y="117.33333333333333" font-size="13" fill="#27303A" font-weight="bold" text-anchor="middle">VNet</text>
<rect x="825" y="90" width="135" height="46" rx="8" fill="#DEE2FB" stroke="#27303A" stroke-width="1.5"/>
<text x="892.5" y="117.33333333333333" font-size="13" fill="#27303A" font-weight="bold" text-anchor="middle">NSG</text>
<rect x="670" y="175" width="290" height="56" rx="8" fill="#27303A" stroke="#27303A" stroke-width="1.5"/>
<text x="815.0" y="207.66666666666666" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">VM vm-web-mm</text>
<line x1="580" y1="200" x2="648" y2="200" stroke="#27303A" stroke-width="2" marker-end="url(#aD)"/>
<rect x="650" y="340" width="330" height="80" rx="8" fill="#DEE2FB" stroke="#006FAD" stroke-width="2"/>
<text x="815.0" y="365.6666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">cloud-init</text>
<text x="815.0" y="384.6666666666667" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">beim ersten Start der VM:</text>
<text x="815.0" y="403.6666666666667" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">Pakete, Dateien, Befehle</text>
<line x1="815" y1="231" x2="815" y2="338" stroke="#006FAD" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#aB)"/>
<text x="825" y="290" font-size="11" fill="#006FAD" font-weight="normal" text-anchor="start">custom data</text>
<text x="500" y="455" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Bicep baut das Haus – cloud-init richtet es beim Einzug ein.</text>
</svg>
