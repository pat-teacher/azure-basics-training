<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" font-family="'Segoe UI', Arial, Helvetica, sans-serif" role="img" aria-label="Stationen einer Anfrage von Internet bis zum Dienst auf der VM">
<defs><marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27303A"/></marker><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#006FAD"/></marker><marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E7D32"/></marker><marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B3261E"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6F6F"/></marker></defs>
<rect width="1000" height="280" fill="#FFFFFF"/>
<rect x="0" y="275" width="1000" height="5" fill="#006FAD"/>
<text x="20" y="30" font-size="18" fill="#27303A" font-weight="bold" text-anchor="start">Der Weg einer Anfrage zu deiner VM – und wo sie scheitern kann</text>
<rect x="20" y="80" width="138" height="60" rx="8" fill="#FFFFFF" stroke="#27303A" stroke-width="1.5"/>
<text x="89.0" y="114.33333333333333" font-size="13" fill="#27303A" font-weight="bold" text-anchor="middle">Internet</text>
<text x="89" y="170" font-size="12" fill="#6F6F6F" font-weight="normal" text-anchor="middle">Browser, ssh</text>
<line x1="158" y1="110" x2="183" y2="110" stroke="#27303A" stroke-width="2" marker-end="url(#aD)"/>
<rect x="183" y="80" width="138" height="60" rx="8" fill="#FFFFFF" stroke="#27303A" stroke-width="1.5"/>
<text x="252.0" y="114.33333333333333" font-size="13" fill="#27303A" font-weight="bold" text-anchor="middle">Öffentliche IP</text>
<text x="252" y="170" font-size="12" fill="#6F6F6F" font-weight="normal" text-anchor="middle">richtige IP?</text>
<line x1="321" y1="110" x2="346" y2="110" stroke="#27303A" stroke-width="2" marker-end="url(#aD)"/>
<rect x="346" y="80" width="138" height="60" rx="8" fill="#DEE2FB" stroke="#006FAD" stroke-width="2.5"/>
<text x="415.0" y="114.33333333333333" font-size="13" fill="#27303A" font-weight="bold" text-anchor="middle">NSG am Subnetz</text>
<text x="415" y="170" font-size="12" fill="#6F6F6F" font-weight="normal" text-anchor="middle">Regel für Port + Quelle?</text>
<line x1="484" y1="110" x2="509" y2="110" stroke="#27303A" stroke-width="2" marker-end="url(#aD)"/>
<rect x="509" y="80" width="138" height="60" rx="8" fill="#DEE2FB" stroke="#006FAD" stroke-width="2.5"/>
<text x="578.0" y="114.33333333333333" font-size="13" fill="#27303A" font-weight="bold" text-anchor="middle">NSG an der NIC</text>
<text x="578" y="170" font-size="12" fill="#6F6F6F" font-weight="normal" text-anchor="middle">falls vorhanden: auch hier?</text>
<line x1="647" y1="110" x2="672" y2="110" stroke="#27303A" stroke-width="2" marker-end="url(#aD)"/>
<rect x="672" y="80" width="138" height="60" rx="8" fill="#FFFFFF" stroke="#27303A" stroke-width="1.5"/>
<text x="741.0" y="114.33333333333333" font-size="13" fill="#27303A" font-weight="bold" text-anchor="middle">Firewall im OS</text>
<text x="741" y="170" font-size="12" fill="#6F6F6F" font-weight="normal" text-anchor="middle">ufw – meist aus</text>
<line x1="810" y1="110" x2="835" y2="110" stroke="#27303A" stroke-width="2" marker-end="url(#aD)"/>
<rect x="835" y="80" width="138" height="60" rx="8" fill="#FFFFFF" stroke="#27303A" stroke-width="1.5"/>
<text x="904.0" y="114.33333333333333" font-size="13" fill="#27303A" font-weight="bold" text-anchor="middle">Dienst</text>
<text x="904" y="170" font-size="12" fill="#6F6F6F" font-weight="normal" text-anchor="middle">läuft nginx / sshd?</text>
<text x="500" y="225" font-size="13" fill="#27303A" font-weight="bold" text-anchor="middle">Fehlersuche: Prüfe die Stationen der Reihe nach von links nach rechts.</text>
<text x="500" y="248" font-size="12" fill="#6F6F6F" font-weight="normal" text-anchor="middle">Eine NSG muss den Verkehr in beiden Ebenen (Subnetz und NIC) erlauben, sonst wird er blockiert.</text>
</svg>
