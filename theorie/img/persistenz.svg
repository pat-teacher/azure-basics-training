<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="'Segoe UI', Arial, Helvetica, sans-serif" role="img" aria-label="Beim Ersetzen der VM gehen OS Disk und Temporary Disk verloren, Data Disk und Blob Storage bleiben">
<defs><marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27303A"/></marker><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#006FAD"/></marker><marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E7D32"/></marker><marker id="aN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B3261E"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6F6F6F"/></marker></defs>
<rect width="1000" height="470" fill="#FFFFFF"/>
<rect x="0" y="465" width="1000" height="5" fill="#006FAD"/>
<text x="20" y="30" font-size="18" fill="#27303A" font-weight="bold" text-anchor="start">Persistenz: Was überlebt, wenn die VM ersetzt wird?</text>
<rect x="220" y="55" width="300" height="50" rx="8" fill="#27303A" stroke="#27303A" stroke-width="1.5"/>
<text x="370.0" y="84.66666666666667" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">vorher: vm-web-mm</text>
<rect x="660" y="55" width="320" height="50" rx="8" fill="#DEE2FB" stroke="#006FAD" stroke-width="2"/>
<text x="820.0" y="75.16666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">nachher: neu erstellt</text>
<text x="820.0" y="94.16666666666667" font-size="12" fill="#27303A" font-weight="normal" text-anchor="middle">z. B. mit Bicep und cloud-init</text>
<line x1="525" y1="80" x2="655" y2="80" stroke="#006FAD" stroke-width="3" marker-end="url(#aB)"/>
<text x="590" y="70" font-size="12" fill="#006FAD" font-weight="bold" text-anchor="middle">VM ersetzen</text>
<rect x="20" y="125" width="180" height="58" rx="8" fill="#D5D8F4" stroke="#6F6F6F" stroke-width="1.5"/>
<text x="110.0" y="158.66666666666666" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">OS Disk</text>
<rect x="220" y="125" width="300" height="58" rx="8" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1.5"/>
<text x="370.0" y="158.33333333333334" font-size="13" fill="#27303A" font-weight="bold" text-anchor="middle">Betriebssystem + was du dort gespeichert hast</text>
<circle cx="590" cy="154" r="20" fill="#B3261E"/>
<text x="590" y="161" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle">✗</text>
<rect x="660" y="125" width="320" height="58" rx="8" fill="#FFFFFF" stroke="#B3261E" stroke-width="2"/>
<text x="820.0" y="158.33333333333334" font-size="13" fill="#B3261E" font-weight="bold" text-anchor="middle">neue, leere OS Disk aus dem Image</text>
<rect x="20" y="197" width="180" height="58" rx="8" fill="#D5D8F4" stroke="#6F6F6F" stroke-width="1.5"/>
<text x="110.0" y="230.66666666666666" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Temporary Disk</text>
<rect x="220" y="197" width="300" height="58" rx="8" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1.5"/>
<text x="370.0" y="230.33333333333334" font-size="13" fill="#27303A" font-weight="bold" text-anchor="middle">Cache, temporäre Dateien</text>
<circle cx="590" cy="226" r="20" fill="#B3261E"/>
<text x="590" y="233" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle">✗</text>
<rect x="660" y="197" width="320" height="58" rx="8" fill="#FFFFFF" stroke="#B3261E" stroke-width="2"/>
<text x="820.0" y="230.33333333333334" font-size="13" fill="#B3261E" font-weight="bold" text-anchor="middle">leer</text>
<rect x="20" y="269" width="180" height="58" rx="8" fill="#DEE2FB" stroke="#006FAD" stroke-width="1.5"/>
<text x="110.0" y="302.6666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Data Disk</text>
<rect x="220" y="269" width="300" height="58" rx="8" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1.5"/>
<text x="370.0" y="302.3333333333333" font-size="13" fill="#27303A" font-weight="bold" text-anchor="middle">deine Daten</text>
<circle cx="590" cy="298" r="20" fill="#2E7D32"/>
<text x="590" y="305" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle">✓</text>
<rect x="660" y="269" width="320" height="58" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
<text x="820.0" y="302.3333333333333" font-size="13" fill="#2E7D32" font-weight="bold" text-anchor="middle">an die neue VM gehängt</text>
<rect x="20" y="341" width="180" height="58" rx="8" fill="#DEE2FB" stroke="#006FAD" stroke-width="1.5"/>
<text x="110.0" y="374.6666666666667" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Blob Storage</text>
<rect x="220" y="341" width="300" height="58" rx="8" fill="#FFFFFF" stroke="#6F6F6F" stroke-width="1.5"/>
<text x="370.0" y="374.3333333333333" font-size="13" fill="#27303A" font-weight="bold" text-anchor="middle">Dateien im Storage Account</text>
<circle cx="590" cy="370" r="20" fill="#2E7D32"/>
<text x="590" y="377" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle">✓</text>
<rect x="660" y="341" width="320" height="58" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
<text x="820.0" y="374.3333333333333" font-size="13" fill="#2E7D32" font-weight="bold" text-anchor="middle">per URL erreichbar wie vorher</text>
<text x="500" y="435" font-size="14" fill="#27303A" font-weight="bold" text-anchor="middle">Faustregel: Die VM ist ersetzbar. Daten gehören auf Speicher, der unabhängig von der VM existiert.</text>
<text x="500" y="458" font-size="12" fill="#6F6F6F" font-weight="normal" text-anchor="middle">✓ bleibt erhalten   ✗ ist weg</text>
</svg>
